<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIRA Activity Graph</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--kira-bg, #000);
      color: var(--kira-ink, #ccc);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #canvas {
      display: block;
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--kira-ink, #ccc);
      z-index: 10;
    }

    .title {
      font-size: 24px;
      color: var(--kira-highlight, #f00);
      margin-bottom: 10px;
    }

    .random-list {
      position: absolute;
      top: 100px;
      left: 50px;
      max-width: 90%;
      max-height: 80%;
      overflow: hidden;
    }

    .random-item {
      color: var(--kira-accent, #0f0);
      font-size: 12px;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .grid {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .grid-cell {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 1px solid var(--kira-grid, #0f0);
      margin: 1px;
      transition: background-color 0.3s;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="info">
      <div class="title">📓 ANALYZING PATTERN...</div>
      <div id="stats"></div>
    </div>
    <canvas id="canvas"></canvas>
    <div id="content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script>
    // Data will be injected by the server
    const DATA = window.ACTIVITY_DATA || {};
    // Internal numeric scene ID (1=random list, 2=month, 3=week, 4=kira/3D).
    // Public view names (kira/month/week) are mapped to these IDs in the server.
    const SCENE = window.RENDER_SCENE || 4;
    const THEME = window.RENDER_THEME || 'film';
    // Palette tokens for the active theme/source. The server resolves these
    // (see src/renderer/palette.js) and injects them; we fall back to film
    // values if rendering this template directly without the server.
    const PALETTE = window.RENDER_PALETTE || {
      background: '#e8e2d4',
      ink: '#3a322a',
      grid: '#bfb6a3',
      accent: '#7a5c3a',
      highlight: '#c14a3a'
    };

    // Mirror palette tokens to CSS variables so the stylesheet picks them up.
    const root = document.documentElement;
    root.style.setProperty('--kira-bg', PALETTE.background);
    root.style.setProperty('--kira-ink', PALETTE.ink);
    root.style.setProperty('--kira-grid', PALETTE.grid);
    root.style.setProperty('--kira-accent', PALETTE.accent);
    root.style.setProperty('--kira-highlight', PALETTE.highlight);

    // Three.js wants 0xRRGGBB ints, not '#rrggbb' strings.
    function hexToInt(h) {
      if (typeof h !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(h)) return 0x000000;
      return parseInt(h.slice(1), 16);
    }
    // ink は CSS variable 側で `.info` 等のテキストに適用される。
    // scene 4 (kira) のサーフェスでも MeshStandardMaterial の base color として使う。
    const COLOR_BG = hexToInt(PALETTE.background);
    const COLOR_INK = hexToInt(PALETTE.ink);
    const COLOR_GRID = hexToInt(PALETTE.grid);
    const COLOR_ACCENT = hexToInt(PALETTE.accent);
    const COLOR_HIGHLIGHT = hexToInt(PALETTE.highlight);

    // Global variables
    let scene, camera, renderer;
    let animationId;

    // Initialize
    function init() {
      console.log('Initializing visualization...', { SCENE, THEME });

      switch (SCENE) {
        case 1:
          renderScene1();
          break;
        case 2:
          renderScene2();
          break;
        case 3:
          renderScene3();
          break;
        case 4:
          renderScene4();
          break;
        default:
          renderScene4();
      }
    }

    /**
     * Scene 1: Random list of activities (chaotic, dev-only auxiliary scene)
     */
    function renderScene1() {
      const content = document.getElementById('content');
      content.className = 'random-list';

      const data = DATA.step1 || [];
      let delay = 0;

      data.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'random-item';
        div.style.animationDelay = `${delay}s`;
        div.style.position = 'absolute';
        div.style.left = `${Math.random() * 80}%`;
        div.style.top = `${Math.random() * 80}%`;
        div.textContent = `${new Date(item.date).toLocaleString()} - ${item.repo}`;
        content.appendChild(div);
        delay += 0.05;
      });
    }

    /**
     * Scene 2 (public: month): Month overview as a 7-column calendar.
     *
     * 直近 ~30 日を Sun..Sat 7 列のグリッドに敷き、各日セルの濃度で
     * 「日量」を、セル右の縦ストリップ 24 本で「時刻帯」を表す。
     * GitHub 草の劣化コピーにせず、time-of-day の偏りを残す中間ビュー。
     */
    function renderScene2() {
      setupThreeJS();

      const calendarData = DATA.step2 || {};
      const full = calendarData.full || {};

      // Sort dates ASC, take the most recent 42 days (max 6 rows × 7 cols)
      const dateKeys = Object.keys(full).sort();
      const recentKeys = dateKeys.slice(-42);

      if (recentKeys.length === 0) {
        console.warn('No calendar data available for month view');
        camera.position.set(0, 0, 12);
        camera.lookAt(0, 0, 0);
        animate();
        return;
      }

      // Build day records and compute the calendar layout.
      // The first cell is placed under its weekday column (Sun=0..Sat=6),
      // earlier weekdays in the same starting week stay empty (no mesh).
      // Parse "YYYY-MM-DD" as local-midnight so getDay()/diffDays line up with
      // the user's wall-clock week (new Date(key) would be UTC and could shift).
      const days = recentKeys.map((key) => {
        const [Y, M, D] = key.split('-').map(Number);
        const date = new Date(Y, M - 1, D);
        const hours = full[key];
        const dayCount = hours.reduce((a, b) => a + b, 0);
        return { key, date, dayOfWeek: date.getDay(), hours, dayCount };
      });

      const firstDay = days[0];
      // Row index: how many weeks elapsed since the start of `firstDay`'s week.
      // rowIndex grows downward (newer = larger). We later flip Y so newer is at bottom.
      const startOfWeek = new Date(firstDay.date);
      startOfWeek.setDate(firstDay.date.getDate() - firstDay.dayOfWeek);
      startOfWeek.setHours(0, 0, 0, 0);

      let rowMax = 0;
      const placed = days.map((d) => {
        const diffDays = Math.floor((d.date - startOfWeek) / (1000 * 60 * 60 * 24));
        const row = Math.floor(diffDays / 7);
        if (row > rowMax) rowMax = row;
        return { ...d, row };
      });

      const dayMax = Math.max(1, ...placed.map((d) => d.dayCount));

      // Layout constants
      // CELL/STEP sized so 7 cols × up to 6 rows (most-recent 42 days) fit
      // inside the central ~60% of the 16:9 viewport at camera z=12.
      const CELL_W = 1.2;
      const CELL_H = 1.0;
      const COL_GAP = 0.15;
      const ROW_GAP = 0.15;
      const STEP_X = CELL_W + COL_GAP;
      const STEP_Y = CELL_H + ROW_GAP;

      // Center horizontally (Sun=col 0, Sat=col 6 -> centered around col 3).
      const COLS = 7;
      const colMid = (COLS - 1) / 2;
      // Center vertically over rowMax+1 rows. Newer = lower (negative Y).
      const rowMid = rowMax / 2;

      // Shared opacity ceiling for both filled cells and stacked week layers
      // so visual peaks line up across views (base opacity differs per view).
      const MAX_OPACITY = 0.9;

      const baseColor = new THREE.Color(COLOR_GRID);
      const accentColor = new THREE.Color(COLOR_ACCENT);
      const highlightColor = new THREE.Color(COLOR_HIGHLIGHT);

      // Empty cell ghost: faint grid plane for every (row, col) slot to give
      // the calendar a frame even on inactive days.
      for (let r = 0; r <= rowMax; r++) {
        for (let c = 0; c < COLS; c++) {
          const ghostGeo = new THREE.PlaneGeometry(CELL_W, CELL_H);
          const ghostMat = new THREE.MeshBasicMaterial({
            color: COLOR_GRID,
            transparent: true,
            opacity: 0.12,
            side: THREE.DoubleSide
          });
          const ghost = new THREE.Mesh(ghostGeo, ghostMat);
          ghost.position.set(
            (c - colMid) * STEP_X,
            -(r - rowMid) * STEP_Y,
            -0.01
          );
          scene.add(ghost);
        }
      }

      // Per-day cell + hour strip
      // To keep draw calls sane, accumulate every hour line for every cell into
      // a single LineSegments built from a shared BufferGeometry.
      const stripPositions = [];
      const stripColors = [];

      placed.forEach((d) => {
        const cx = (d.dayOfWeek - colMid) * STEP_X;
        const cy = -(d.row - rowMid) * STEP_Y;

        // Day-level density plane (day count -> color from grid->accent).
        // 0-activity days fall through to the ghost grid alone — adding a
        // dim fill plane on top would just dirty the empty look.
        if (d.dayCount > 0) {
          const intensity = d.dayCount / dayMax; // 0..1
          const fillColor = baseColor.clone().lerp(accentColor, intensity);
          const fillMat = new THREE.MeshBasicMaterial({
            color: fillColor,
            transparent: true,
            // Base 0.55, ramp by intensity toward MAX_OPACITY (0.55 + 0.35).
            opacity: 0.55 + intensity * (MAX_OPACITY - 0.55),
            side: THREE.DoubleSide
          });
          const fillGeo = new THREE.PlaneGeometry(CELL_W, CELL_H);
          const fill = new THREE.Mesh(fillGeo, fillMat);
          fill.position.set(cx, cy, 0);
          scene.add(fill);
        }

        // 24-hour strip on the right portion of the cell.
        // Strip spans ~45% of cell width (right half-ish) and full cell height.
        const STRIP_W = CELL_W * 0.45;
        const cellRight = cx + CELL_W * 0.5;
        const STRIP_LEFT = cellRight - STRIP_W - 0.05;
        const STRIP_TOP = cy + (CELL_H * 0.4);
        const STRIP_BOT = cy - (CELL_H * 0.4);
        const STRIP_HEIGHT = STRIP_TOP - STRIP_BOT;
        const HOUR_STEP = STRIP_W / 24;

        // Per-day normalization: read "this day's hour-of-day skew", not the
        // month-wide peak. With overall normalization an average day's strip
        // would flatline whenever a single outlier day spiked.
        const dayHourMax = Math.max(1, ...d.hours);

        for (let h = 0; h < 24; h++) {
          const count = d.hours[h];
          if (count === 0) continue;
          const hIntensity = Math.min(count / dayHourMax, 1);
          const lineColor = accentColor.clone().lerp(highlightColor, hIntensity);
          const lineX = STRIP_LEFT + (h + 0.5) * HOUR_STEP;
          // Line height proportional to intensity (40%..100% of strip height).
          const lineH = STRIP_HEIGHT * (0.4 + 0.6 * hIntensity);
          const yMid = (STRIP_TOP + STRIP_BOT) / 2;
          const yTop = yMid + lineH / 2;
          const yBot = yMid - lineH / 2;

          stripPositions.push(lineX, yBot, 0.02, lineX, yTop, 0.02);
          stripColors.push(
            lineColor.r, lineColor.g, lineColor.b,
            lineColor.r, lineColor.g, lineColor.b
          );
        }
      });

      if (stripPositions.length > 0) {
        const stripGeo = new THREE.BufferGeometry();
        stripGeo.setAttribute(
          'position',
          new THREE.Float32BufferAttribute(stripPositions, 3)
        );
        stripGeo.setAttribute(
          'color',
          new THREE.Float32BufferAttribute(stripColors, 3)
        );
        const stripMat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: 0.9
        });
        const strip = new THREE.LineSegments(stripGeo, stripMat);
        scene.add(strip);
      }

      // Static camera; aspect-ratio-friendly distance.
      camera.position.set(0, 0, 12);
      camera.lookAt(0, 0, 0);
      animate();
    }

    /**
     * Scene 3 (public: week): Weekly Overlay over a 7 x 24 grid.
     *
     * 週ごとの活動を半透明レイヤーとして 7×24 グリッドに累積させる。
     * 同じ time slot に活動が重なるほどセルが濃くなり、繰り返し bias が
     * 視覚的に立ち上がる。MVP の主役となる分析ビュー。
     */
    function renderScene3() {
      setupThreeJS();

      const calendarData = DATA.step2 || {};
      const weeksAll = calendarData.weeks || [];

      // Cap the layered weeks. Invariant: visible-layers × interval < waitTime
      // (12 weeks × 400ms = 4800ms < 5000ms wait in webp-generator.js).
      // Older weeks are dropped so the screenshot always lands on a settled
      // grid rather than mid-animation.
      const MAX_WEEKS = 12;
      const weeks = weeksAll.slice(-MAX_WEEKS);

      // Layout: 7 (weekday) rows x 24 (hour) columns
      // CELL/STEP sized so 24 cols × 7 rows fit inside the central ~60% of
      // the 16:9 viewport at camera z=8.
      const HOURS = 24;
      const DAYS = 7;
      const CELL_W = 0.45;
      const CELL_H = 0.65;
      const STEP_X = 0.5;
      const STEP_Y = 0.7;

      // Shared opacity ceiling with renderScene2 (base differs per view).
      const MAX_OPACITY = 0.9;

      // Pre-create 7×24 cell meshes with empty (ghost) state. We update
      // their material color/opacity as weekly layers accumulate.
      const cellMeshes = [];
      const ghostColor = new THREE.Color(COLOR_GRID);
      const accentColor = new THREE.Color(COLOR_ACCENT);
      const highlightColor = new THREE.Color(COLOR_HIGHLIGHT);

      for (let d = 0; d < DAYS; d++) {
        cellMeshes.push([]);
        for (let h = 0; h < HOURS; h++) {
          const geo = new THREE.PlaneGeometry(CELL_W, CELL_H);
          const mat = new THREE.MeshBasicMaterial({
            color: ghostColor.clone(),
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(
            (h - 11.5) * STEP_X,
            (d - 3) * STEP_Y,
            0
          );
          scene.add(mesh);
          cellMeshes[d].push(mesh);
        }
      }

      // Accumulator: each (dayOfWeek, hour) tracks total count across weeks.
      const aggregated = Array.from({ length: DAYS }, () => new Array(HOURS).fill(0));

      // Pre-compute the final max across all weeks so we can normalize against
      // a fixed ceiling. Earlier per-frame normalization made already-painted
      // peaks fade as new peaks emerged, which contradicted the "repeated
      // slots grow denser as layers accumulate" acceptance criterion.
      const finalAgg = Array.from({ length: DAYS }, () => new Array(HOURS).fill(0));
      weeks.forEach((week) => {
        week.forEach((day) => {
          if (!day.hours) return;
          for (let h = 0; h < HOURS; h++) {
            const count = day.hours[h];
            if (count > 0) finalAgg[day.dayOfWeek][h] += count;
          }
        });
      });
      let finalMax = 0;
      for (let d = 0; d < DAYS; d++) {
        for (let h = 0; h < HOURS; h++) {
          if (finalAgg[d][h] > finalMax) finalMax = finalAgg[d][h];
        }
      }
      finalMax = Math.max(finalMax, 1);

      function applyCellState(d, h, intensity, hasData) {
        const mesh = cellMeshes[d][h];
        if (!hasData) {
          mesh.material.color.copy(ghostColor);
          mesh.material.opacity = 0.15;
          return;
        }
        const color = accentColor.clone().lerp(highlightColor, intensity);
        mesh.material.color.copy(color);
        // Layered density: even a single hit is visible (0.4), peaks reach
        // MAX_OPACITY (0.4 + 0.5).
        mesh.material.opacity = 0.4 + intensity * (MAX_OPACITY - 0.4);
      }

      let weekIndex = 0;
      function addWeekLayer() {
        if (weekIndex >= weeks.length) return;

        const week = weeks[weekIndex];
        week.forEach((day) => {
          const dayOfWeek = day.dayOfWeek;
          const hours = day.hours;
          for (let h = 0; h < HOURS; h++) {
            if (hours[h] > 0) {
              aggregated[dayOfWeek][h] += hours[h];
            }
          }
        });

        // Update every cell. Normalizing against finalMax means a slot's
        // intensity only ever climbs as more weeks land — past peaks stay
        // put when new peaks emerge.
        for (let d = 0; d < DAYS; d++) {
          for (let h = 0; h < HOURS; h++) {
            const c = aggregated[d][h];
            applyCellState(d, h, Math.min(c / finalMax, 1), c > 0);
          }
        }

        weekIndex++;
        if (weekIndex < weeks.length) {
          setTimeout(addWeekLayer, 400);
        }
      }

      // Static camera; framing fits 24 cols (~12 wide) and 7 rows (~5 tall).
      camera.position.set(0, 0, 8);
      camera.lookAt(0, 0, 0);

      if (weeks.length > 0) {
        addWeekLayer();
      } else {
        console.warn('No weekly data available for week overlay');
      }

      animate();
    }

    /**
     * Scene 4 (public: kira): Surveillance-analysis surface.
     *
     * weekday (Z) x hour (X) x activity (Y) を、半透明のハイトフィールド
     * サーフェス + ワイヤーフレーム + ピーク強調の発光垂線で表現する。
     * ベースの bar/line ではなく「分析画面」のニュアンスを優先。
     */
    function renderScene4() {
      setupThreeJS();

      // MeshStandardMaterial を使うために光源が必要。scene 1/2/3 は
      // setupThreeJS のみで light を持たないため、ここで scene 4 専用に
      // 追加する（影響範囲を局所化）。
      // setupThreeJS() で scene を毎回新規生成するため、light が累積する心配はない
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const grid = DATA.step4 || [];
      const maxCount = Math.max(...grid.map(c => c.count), 1);

      // 7 (weekday) x 24 (hour) のハイトマップを構築
      const heightMap = Array.from({ length: 7 }, () => new Array(24).fill(0));
      grid.forEach(c => {
        if (c.dayIndex >= 0 && c.dayIndex < 7 && c.hour >= 0 && c.hour < 24) {
          heightMap[c.dayIndex][c.hour] = (c.count / maxCount) * 5;
        }
      });

      // ベースのサーフェス: 24 hour x 7 day 分の頂点を持つ Plane
      // PlaneGeometry(width, height, widthSegments, heightSegments)
      // → widthSegments+1 × heightSegments+1 = 24 × 7 個の頂点
      // dayIndex 0=Sunday は world Z=-3 (奥)、6=Saturday は world Z=+3 (手前)。
      // 自動回転するため特定の曜日が常に奥/手前になる懸念はない。
      const PLANE_WIDTH = 23;  // 24 hours -> 23 segments
      const PLANE_DEPTH = 6;   // 7 days   -> 6 segments
      const HOURS_SEG = 23;
      const DAYS_SEG = 6;
      const planeGeo = new THREE.PlaneGeometry(PLANE_WIDTH, PLANE_DEPTH, HOURS_SEG, DAYS_SEG);
      const positions = planeGeo.attributes.position;
      // PlaneGeometry はデフォルトで XY 平面に展開される。Z 軸方向に
      // displace してから後で X 軸まわりに -90deg 回転して水平に倒す。
      // 頂点は row-major: index = row * (widthSegments+1) + col
      for (let z = 0; z < 7; z++) {
        for (let x = 0; x < 24; x++) {
          const idx = z * 24 + x;
          positions.setZ(idx, heightMap[z][x]);
        }
      }
      positions.needsUpdate = true;
      planeGeo.computeVertexNormals();

      const surfaceMat = new THREE.MeshStandardMaterial({
        color: COLOR_INK,
        flatShading: true,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.7,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1
      });
      const surface = new THREE.Mesh(planeGeo, surfaceMat);
      surface.rotation.x = -Math.PI / 2;
      scene.add(surface);

      // サーフェス上のワイヤーフレーム（同じ geometry に重ねる）
      const wireGeo = new THREE.WireframeGeometry(planeGeo);
      const wireMat = new THREE.LineBasicMaterial({
        color: COLOR_GRID,
        transparent: true,
        opacity: 0.6
      });
      const wire = new THREE.LineSegments(wireGeo, wireMat);
      wire.rotation.x = -Math.PI / 2;
      scene.add(wire);

      // ピーク強調の発光垂線
      // count が maxCount * PEAK_RATIO 以上のセルだけ、地面からサーフェスまで
      // highlight 色の縦線を立てる。これが「luminous edge treatment」と
      // 「readable bias」の主役。
      // 値が均一な日に 168 本立たないよう、ranking で上位 N に限定する。
      const PEAK_RATIO = 0.7;  // maxCount の 70% 以上を peak とみなす
      const PEAK_LIMIT = 20;   // ornamental clutter を避けるため上位 N 個に限定
      const peakThreshold = 5 * PEAK_RATIO;

      const ranked = [];
      for (let z = 0; z < 7; z++) {
        for (let x = 0; x < 24; x++) {
          ranked.push({ z, x, h: heightMap[z][x] });
        }
      }
      ranked.sort((a, b) => b.h - a.h);
      const peaks = ranked.slice(0, PEAK_LIMIT).filter(p => p.h >= peakThreshold && p.h > 0);

      const peakMat = new THREE.LineBasicMaterial({ color: COLOR_HIGHLIGHT });
      peaks.forEach(({ z, x, h }) => {
        // PlaneGeometry の row z は plane local Y = (3 - z) に配置される。
        // surface.rotation.x = -PI/2 で local Y → world -Z に写るので、
        // row z の world Z = -(3 - z) = z - 3。peak ラインも同じ式で立てる。
        const wx = x - 11.5;
        const wz = z - 3;
        const peakGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(wx, 0, wz),
          new THREE.Vector3(wx, h, wz)
        ]);
        scene.add(new THREE.Line(peakGeo, peakMat));
      });

      addGrid3D();
      addAxes3D();

      // カメラは少し引いて全体のシルエットを掴む。注視点を少し上げる
      // ことでサーフェス全体が視野中心に収まる。
      camera.position.set(18, 12, 18);
      camera.lookAt(0, 1, 0);

      // calm, restrained な自動回転 (旧 0.005 → 0.002)
      let angle = 0;
      function rotateCamera() {
        angle += 0.002;
        camera.position.x = Math.cos(angle) * 18;
        camera.position.z = Math.sin(angle) * 18;
        camera.lookAt(0, 1, 0);
      }

      function animate3D() {
        animationId = requestAnimationFrame(animate3D);
        rotateCamera();
        renderer.render(scene, camera);
      }

      animate3D();
    }

    /**
     * Setup Three.js scene
     */
    function setupThreeJS() {
      const canvas = document.getElementById('canvas');
      const container = document.getElementById('container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(COLOR_BG);

      camera = new THREE.PerspectiveCamera(
        75,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
      );

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    /**
     * Animation loop
     */
    function animate() {
      animationId = requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    /**
     * Add 2D axes
     */
    function addAxes() {
      // X axis
      const xGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-5, -3, 0),
        new THREE.Vector3(5, -3, 0)
      ]);
      const xMaterial = new THREE.LineBasicMaterial({ color: COLOR_GRID });
      const xAxis = new THREE.Line(xGeometry, xMaterial);
      scene.add(xAxis);

      // Y axis
      const yGeometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-3, -3, 0),
        new THREE.Vector3(-3, 3, 0)
      ]);
      const yMaterial = new THREE.LineBasicMaterial({ color: COLOR_GRID });
      const yAxis = new THREE.Line(yGeometry, yMaterial);
      scene.add(yAxis);
    }

    /**
     * Add 3D grid
     */
    function addGrid3D() {
      // Both center and outer grid lines use the grid token; depth is
      // implied by the geometry, not by a chroma split.
      const gridHelper = new THREE.GridHelper(24, 24, COLOR_GRID, COLOR_GRID);
      gridHelper.position.y = -0.1;
      scene.add(gridHelper);
    }

    /**
     * Add 3D axes.
     *
     * THREE.AxesHelper hardcodes R/G/B for X/Y/Z, which clashes with the
     * mono / film / sepia palettes. We draw three plain lines in the grid
     * token instead so axes stay on-theme across all themes.
     */
    function addAxes3D() {
      const len = 10;
      const mat = new THREE.LineBasicMaterial({ color: COLOR_GRID });
      [
        [[0,0,0],[len,0,0]],
        [[0,0,0],[0,len,0]],
        [[0,0,0],[0,0,len]]
      ].forEach(([a, b]) => {
        const g = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(...a), new THREE.Vector3(...b)
        ]);
        scene.add(new THREE.Line(g, mat));
      });
    }

    // Start when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
